            '<p class="mt-2 text-sm leading-relaxed text-slate-600 sm:text-base">Агенты запускаются строго последовательно, а их зоны ответственности не смешиваются: от структуры сделки до моделирования уловок подрядчика и итоговых правок.</p>' +
            '</div>' +
            '<div class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-3">' +
            agentsCardsHtml +
            '</div>' +
            '</div>' +
            '</section>' +
            // STIMIT Project Showcase Block
            '<section id="stimit-section" class="mx-auto max-w-6xl px-4 py-14 sm:px-6 sm:py-16">' +
            '<div class="grid gap-8 rounded-xl border border-slate-200 bg-white p-6 sm:p-8 lg:grid-cols-12 lg:items-center">' +
            '<div class="lg:col-span-8">' +
            '<div class="text-xs font-semibold text-[#1B3A6B]">Раздел «Проекты» · Методология STIMIT</div>' +
            '<h2 class="mt-2 text-2xl font-bold tracking-tight text-slate-900">' +
            escapeHtml(STIMIT_PROJECT_BLOCK.title) +
            '</h2>' +
            '<p class="mt-3 text-sm leading-relaxed text-slate-600 sm:text-base">' +
            escapeHtml(STIMIT_PROJECT_BLOCK.description) +
            '</p>' +
            '</div>' +
            '<div class="flex flex-col gap-3 border-t border-slate-100 pt-5 lg:col-span-4 lg:border-t-0 lg:border-l lg:border-slate-200 lg:pl-8 lg:pt-0">' +
            '<div class="flex items-center gap-3 text-sm text-slate-700">' +
            ICONS.shieldAlert('h-4 w-4 shrink-0 text-[#1B3A6B]') +
            '<span>Поиск ловушек в Яндекс.Директ, Telegram Ads, VK и RuTube</span>' +
            '</div>' +
            '<div class="flex items-center gap-3 text-sm text-slate-700">' +
            ICONS.scale('h-4 w-4 shrink-0 text-[#1B3A6B]') +
            '<span>Автономный статический стенд без внешних API</span>' +
            '</div>' +
            '<button type="button" data-action="start-scenario" data-scenario="' +
            primaryScenario.id +
            '" class="mt-2 inline-flex items-center justify-center gap-2 rounded-lg bg-[#1B3A6B] px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-[#142D54] whitespace-nowrap cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B] focus-visible:ring-offset-2">' +
            '<span>Запустить демонстрацию</span>' +
            ICONS.arrowRight('h-4 w-4') +
            '</button>' +
            '</div>' +
            '</div>' +
            '</section>' +
            '<footer class="border-t border-slate-200 bg-white py-6">' +
            '<div class="mx-auto flex max-w-6xl flex-col gap-2 px-4 text-xs text-slate-500 sm:flex-row sm:items-center sm:justify-between sm:px-6">' +
            '<span>STIMIT · AI-юрист по рекламным договорам</span>' +
            '<span>Демонстрационный стенд со встроенными сценариями</span>' +
            '</div>' +
            '</footer>' +
            '</main>'
          );
        }

        function renderAuditWorkspace() {
          const scenario = getScenario(state.activeScenarioId);
          const isAllStepsDone = state.completedStepCount >= scenario.steps.length;
          const activeStep =
            scenario.steps[Math.min(state.currentStepIndex, scenario.steps.length - 1)];
          const latestInspectedStep =
            state.completedStepCount > 0 ? scenario.steps[state.completedStepCount - 1] : null;

          const activeAgentId = latestInspectedStep
            ? latestInspectedStep.activeAgentId
            : activeStep.activeAgentId;
          const activeAgentMeta = AGENTS.find(function (a) {
            return a.id === activeAgentId;
          });

          const displayedStepNumber = Math.min(state.currentStepIndex + 1, scenario.steps.length);
          const progressPercent = (state.completedStepCount / scenario.steps.length) * 100;

          const pipelineActiveIds = isAllStepsDone
            ? ['critic', 'enhancer']
            : activeStep.activeAgentIdsInPipeline;
          const pipelineCompletedIds = isAllStepsDone
            ? ['analyst', 'lawyer', 'balance', 'antagonist']
            : activeStep.completedAgentIdsInPipeline;

          const visibleClauses = scenario.clauses.filter(function (c) {
            return activeStep.clauseNumbers.indexOf(c.number) !== -1;
          });

          // Hint bubble
          const hintBubbleHtml = state.showHintBubble
            ? '<div class="mt-4 flex items-center justify-between gap-4 rounded-xl border border-[#1B3A6B]/25 bg-[#1B3A6B]/[0.06] px-4 py-3 text-sm text-[#1B3A6B] animate-fade-slide-up">' +
              '<p class="font-medium leading-snug">Вы — заказчик. Читайте договор по шагам, выбирайте реплики и смотрите, как думают агенты.</p>' +
              '<button type="button" data-action="dismiss-hint" aria-label="Скрыть подсказку" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-[#1B3A6B]/70 transition-colors hover:bg-[#1B3A6B]/10 hover:text-[#1B3A6B] cursor-pointer">' +
              ICONS.x('h-4 w-4') +
              '</button>' +
              '</div>'
            : '';

          // Dialogue stream
          let dialogueHtml = '';
          if (state.dialogue.length > 0) {
            dialogueHtml =
              '<div class="space-y-3">' +
              state.dialogue
                .map(function (entry) {
                  if (entry.kind === 'user-reply' || entry.kind === 'user-free-input') {
                    return (
                      '<div class="flex justify-end animate-fade-slide-up">' +
                      '<div class="max-w-[88%] rounded-xl bg-[#1B3A6B] px-4 py-3 text-sm leading-relaxed text-white">' +
                      (entry.stepNumber
                        ? '<div class="mb-1 text-[11px] font-medium text-blue-200">Вы (заказчик) · Шаг ' +
                          entry.stepNumber +
                          '</div>'
                        : '') +
                      '<p>' +
                      escapeHtml(entry.text) +
                      '</p>' +
                      '</div>' +
                      '</div>'
                    );
                  }
                  if (entry.kind === 'system-comment') {
                    return (
                      '<div class="flex justify-start animate-fade-slide-up">' +
                      '<div class="max-w-[92%] rounded-xl border border-amber-200 bg-amber-50/80 px-4 py-3 text-sm leading-relaxed text-slate-800">' +
                      '<div class="mb-1 text-xs font-semibold text-amber-800">Комментарий системы</div>' +
                      '<p>' +
                      escapeHtml(entry.text) +
                      '</p>' +
                      '</div>' +
                      '</div>'
                    );
                  }
                  if (entry.kind === 'demo-honest-reply') {
                    const scenarioButtons = SCENARIOS.map(function (sc) {
                      const activeBtn =
                        sc.id === scenario.id
                          ? 'border-[#1B3A6B] bg-[#1B3A6B]/10 text-[#1B3A6B]'
                          : 'border-slate-300 bg-white text-slate-700 hover:bg-slate-50';
                      return (
                        '<button type="button" data-action="start-scenario" data-scenario="' +
                        sc.id +
                        '" class="rounded-lg border px-3 py-1.5 text-xs font-semibold transition-colors cursor-pointer ' +
                        activeBtn +
                        '">' +
                        escapeHtml(sc.shortLabel) +
                        '</button>'
                      );
                    }).join('');

                    return (
                      '<div class="flex justify-start animate-fade-slide-up">' +
                      '<div class="max-w-[92%] rounded-xl border border-slate-200 bg-white px-4 py-3.5 text-sm text-slate-800">' +
                      '<p class="font-medium">' +
                      escapeHtml(entry.text) +
                      '</p>' +
                      '<div class="mt-3 flex flex-wrap gap-2">' +
                      scenarioButtons +
                      '</div>' +
                      '</div>' +
                      '</div>'
                    );
                  }
                  return (
                    '<div class="flex justify-start animate-fade-slide-up">' +
                    '<div class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-xs leading-relaxed text-slate-600">' +
                    '<span class="font-semibold text-slate-800">Шаг ' +
                    entry.stepNumber +
                    ' завершён (' +
                    escapeHtml(entry.sectionLabel) +
                    '):</span> находки агентов обновлены в панели анализа.' +
                    '</div>' +
                    '</div>'
                  );
                })
                .join('') +
              '</div>';
          }

          // Typing indicator
          const typingHtml = state.isTyping
            ? '<div class="flex justify-start">' +
              '<div class="inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-4 py-2.5 text-xs font-medium text-slate-500">' +
              '<span class="inline-flex gap-1" aria-hidden="true">' +
              '<span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400"></span>' +
              '<span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400" style="animation-delay: 0.15s"></span>' +
              '<span class="h-1.5 w-1.5 animate-bounce rounded-full bg-slate-400" style="animation-delay: 0.3s"></span>' +
              '</span>' +
              '<span>печатает…</span>' +
              '</div>' +
              '</div>'
            : '';

          // Active Step Card or Finish CTA
          let stepOrFinishHtml = '';
          if (!isAllStepsDone && !state.isTyping) {
            const clausesHtml = visibleClauses
              .map(function (clause) {
                return (
                  '<p class="text-xs leading-relaxed text-slate-600 sm:text-sm">' +
                  '<span class="font-mono font-semibold text-slate-800 mr-1.5">' +
                  clause.number +
                  '. ' +
                  escapeHtml(clause.title) +
                  '.</span>' +
                  escapeHtml(clause.text) +
                  '</p>'
                );
              })
              .join('');

            const repliesHtml = activeStep.replies
              .map(function (reply) {
                const btnStyle = reply.isPrimary
                  ? 'border-[#1B3A6B]/35 bg-white text-slate-900 hover:border-[#1B3A6B] hover:bg-[#1B3A6B]/[0.04]'
                  : 'border-slate-200 bg-slate-50/70 text-slate-700 hover:border-slate-300 hover:bg-white hover:text-slate-900';

                return (
                  '<button type="button" data-action="select-reply" data-reply-id="' +
                  escapeHtml(reply.id) +
                  '" class="group flex w-full items-center justify-between gap-3 rounded-lg border px-4 py-3 text-left text-sm font-medium transition-all duration-150 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B] ' +
                  btnStyle +
                  '">' +
                  '<span>' +
                  escapeHtml(reply.label) +
                  '</span>' +
                  ICONS.arrowRight(
                    'h-4 w-4 shrink-0 text-slate-400 transition-transform group-hover:translate-x-0.5 group-hover:text-[#1B3A6B]'
                  ) +
                  '</button>'
                );
              })
              .join('');

            stepOrFinishHtml =
              '<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm animate-fade-slide-up">' +
              '<div class="flex flex-wrap items-center justify-between gap-2">' +
              '<span class="text-xs font-semibold text-[#1B3A6B]">' +
              escapeHtml(activeStep.sectionLabel) +
              '</span>' +
              '<span class="font-mono text-xs tabular-nums text-slate-400">Шаг ' +
              activeStep.stepNumber +
              ' / ' +
              scenario.steps.length +
              '</span>' +
              '</div>' +
              '<div class="mt-3 space-y-2.5 rounded-lg border border-slate-200/80 bg-[#F8FAFC] p-4">' +
              clausesHtml +
              '</div>' +
              '<div class="mt-4 rounded-lg border border-[#1B3A6B]/20 bg-[#1B3A6B]/[0.04] p-4">' +
              '<div class="text-xs font-semibold text-[#1B3A6B]">Ключевая цитата раздела</div>' +
              '<p class="mt-1 text-sm font-medium leading-relaxed text-slate-900">«' +
              escapeHtml(activeStep.quote) +
              '»</p>' +
              '</div>' +
              '<div class="mt-5">' +
              '<div class="mb-2.5 text-xs font-medium text-slate-500">Выберите вашу реплику заказчика:</div>' +
              '<div class="flex flex-col gap-2.5">' +
              repliesHtml +
              '</div>' +
              '</div>' +
              '</div>';
          } else if (isAllStepsDone && !state.isTyping) {
            stepOrFinishHtml =
              '<div class="rounded-xl border border-[#1B3A6B]/25 bg-white p-6 shadow-sm animate-fade-slide-up">' +
              '<div class="text-xs font-semibold text-[#1B3A6B]">Конвейер завершён · Критик и Улучшатель готовы</div>' +
              '<h2 class="mt-1.5 text-lg font-bold text-slate-900">Все 5 этапов проверки пройдены</h2>' +
              '<p class="mt-1.5 text-sm leading-relaxed text-slate-600">Критик собрал и приоритизировал риски, а Улучшатель подготовил список правок и финальный вердикт по договору.</p>' +
              '<button type="button" data-action="finish-mission" class="mt-5 inline-flex w-full items-center justify-center gap-2.5 rounded-lg bg-[#1B3A6B] px-6 py-3.5 text-base font-bold text-white transition-colors hover:bg-[#142D54] cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B] focus-visible:ring-offset-2">' +
              '<span>Смотреть итог миссии</span>' +
              ICONS.arrowRight('h-4 w-4') +
              '</button>' +
              '</div>';
          }

          // Compact Agent Panel
          const shouldFlash = state.flashCounter !== state.lastFlashRendered;
          state.lastFlashRendered = state.flashCounter;

          let agentPanelBodyHtml = '';
          if (!latestInspectedStep) {
            agentPanelBodyHtml =
              '<div class="mt-4 rounded-lg border border-slate-200/80 bg-[#F8FAFC] p-4 text-sm leading-relaxed text-slate-600">' +
              'Выберите первую реплику в диалоге слева — агенты разберут раздел договора и покажут скрытые риски и лазейки подрядчика.' +
              '</div>';
          } else {
            const fieldsHtml = latestInspectedStep.compactSummaryFields
              .map(function (field) {
                const toneCls =
                  field.tone === 'danger'
                    ? 'text-red-700'
                    : field.tone === 'warning'
                      ? 'text-amber-700'
                      : 'text-slate-900';

                return (
                  '<div class="rounded-lg border border-slate-200 bg-[#F8FAFC] px-3.5 py-2.5 ' +
                  (shouldFlash ? 'animate-field-flash' : '') +
                  '">' +
                  '<div class="text-xs text-slate-500">' +
                  escapeHtml(field.label) +
                  '</div>' +
                  '<div class="mt-0.5 text-sm font-semibold leading-snug ' +
                  toneCls +
                  '">' +
                  escapeHtml(field.value) +
                  '</div>' +
                  '</div>'
                );
              })
              .join('');

            let detailsAccordionHtml = '';
            if (state.showAgentDetails) {
              const historySteps = scenario.steps
                .slice(0, state.completedStepCount)
                .slice()
                .reverse()
                .map(function (doneStep) {
                  const findingsHtml = doneStep.findings
                    .map(function (finding) {
                      return (
                        '<div class="rounded-md border border-slate-200/80 bg-white p-2.5">' +
                        '<div class="text-xs font-semibold text-[#1B3A6B]">' +
                        escapeHtml(finding.agentLabel) +
                        '</div>' +
                        '<p class="mt-1 text-xs leading-relaxed text-slate-700">' +
                        escapeHtml(finding.text) +
                        '</p>' +
                        '</div>'
                      );
                    })
                    .join('');

                  return (
                    '<div class="rounded-lg border border-slate-200 bg-slate-50/70 p-3.5">' +
                    '<div class="text-xs font-bold text-slate-800">Шаг ' +
                    doneStep.stepNumber +
                    ' · ' +
                    escapeHtml(doneStep.sectionLabel) +
                    '</div>' +
                    '<div class="mt-2 space-y-2.5">' +
                    findingsHtml +
                    '</div>' +
                    '</div>'
                  );
                })
                .join('');

              detailsAccordionHtml =
                '<div class="mt-3 space-y-3 animate-fade-slide-up">' +
                historySteps +
                '</div>';
            }

            agentPanelBodyHtml =
              '<div class="mt-4 space-y-2.5">' +
              fieldsHtml +
              '</div>' +
              '<div class="mt-4 border-t border-slate-100 pt-3.5">' +
              '<button type="button" data-action="toggle-agent-details" aria-expanded="' +
              (state.showAgentDetails ? 'true' : 'false') +
              '" class="flex w-full items-center justify-between gap-2 rounded-lg border border-slate-200 bg-white px-3.5 py-2.5 text-xs font-semibold text-[#1B3A6B] transition-colors hover:bg-slate-50 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
              '<span>Подробнее: как думали агенты</span>' +
              (state.showAgentDetails
                ? ICONS.chevronUp('h-4 w-4 shrink-0')
                : ICONS.chevronDown('h-4 w-4 shrink-0')) +
              '</button>' +
              detailsAccordionHtml +
              '</div>';
          }

          const contractSectionVisibility =
            state.mobileTab === 'contract' ? 'block' : 'hidden lg:block';
          const agentsSectionVisibility =
            state.mobileTab === 'agents' ? 'block' : 'hidden lg:block';

          return (
            '<main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-8">' +
            // Workspace Header Bar
            '<div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">' +
            '<div>' +
            '<div class="flex flex-wrap items-center gap-2 text-xs font-medium text-slate-500">' +
            '<span class="font-mono font-semibold tabular-nums text-[#1B3A6B]">Шаг ' +
            displayedStepNumber +
            ' из ' +
            scenario.steps.length +
            '</span>' +
            '<span aria-hidden="true">·</span>' +
            '<span>' +
            escapeHtml(scenario.channelTag) +
            '</span>' +
            '<span aria-hidden="true">·</span>' +
            '<span class="font-mono tabular-nums">' +
            escapeHtml(scenario.budgetSummary) +
            '</span>' +
            '</div>' +
            '<h1 class="mt-1 text-xl font-bold tracking-tight text-slate-900 sm:text-2xl">' +
            escapeHtml(scenario.title) +
            '</h1>' +
            '</div>' +
            '<div class="flex items-center gap-3 shrink-0">' +
            '<button type="button" data-action="open-full-contract" data-clauses="' +
            activeStep.clauseNumbers.join(',') +
            '" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-3.5 py-2 text-xs font-semibold text-slate-700 transition-colors hover:bg-slate-50 hover:text-slate-900 whitespace-nowrap shrink-0 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
            ICONS.fileText('h-4 w-4 text-[#1B3A6B]') +
            '<span>Полный текст договора</span>' +
            '</button>' +
            '</div>' +
            '</div>' +
            // Step Progress Line
            '<div class="mt-4 h-1.5 w-full overflow-hidden rounded-full bg-slate-200">' +
            '<div class="h-full rounded-full bg-[#1B3A6B] transition-all duration-300" style="width: ' +
            Math.max(progressPercent, isAllStepsDone ? 100 : 8) +
            '%"></div>' +
            '</div>' +
            // Pipeline Status
            '<div class="mt-4">' +
            renderWorkspacePipeline(pipelineActiveIds, pipelineCompletedIds) +
            '</div>' +
            hintBubbleHtml +
            // Mobile Tab Switcher
            '<div class="mt-5 flex items-center gap-1 rounded-lg bg-slate-200/75 p-1 lg:hidden">' +
            '<button type="button" data-action="mobile-tab" data-tab="contract" class="flex-1 rounded-md px-3 py-2 text-sm font-semibold transition-colors cursor-pointer ' +
            (state.mobileTab === 'contract'
              ? 'bg-white text-[#1B3A6B] shadow-sm'
              : 'text-slate-600 hover:text-slate-900') +
            '">Договор</button>' +
            '<button type="button" data-action="mobile-tab" data-tab="agents" class="flex-1 rounded-md px-3 py-2 text-sm font-semibold transition-colors cursor-pointer ' +
            (state.mobileTab === 'agents'
              ? 'bg-white text-[#1B3A6B] shadow-sm'
              : 'text-slate-600 hover:text-slate-900') +
            '">Агенты (' +
            state.completedStepCount +
            '/' +
            scenario.steps.length +
            ')</button>' +
            '</div>' +
            // Main Split Workspace
            '<div class="mt-5 grid gap-6 lg:grid-cols-12 lg:items-start">' +
            // Left Column
            '<section aria-label="Разбор договора по шагам" class="lg:col-span-7 space-y-4 ' +
            contractSectionVisibility +
            '">' +
            '<div class="rounded-xl border border-slate-200 bg-white p-5">' +
            '<div class="text-xs font-semibold text-slate-500">Вводная ситуация</div>' +
            '<p class="mt-1.5 text-sm leading-relaxed text-slate-800 sm:text-base">' +
            escapeHtml(scenario.entryContext) +
            '</p>' +
            '</div>' +
            dialogueHtml +
            typingHtml +
            stepOrFinishHtml +
            '<form id="free-input-form" class="flex items-center gap-2 rounded-xl border border-slate-200 bg-white p-2">' +
            '<input id="free-input-field" type="text" placeholder="Задать свой вопрос или вставить пункт договора…" aria-label="Свободный ввод вопроса" class="min-w-0 flex-1 bg-transparent px-3 py-2 text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none" />' +
            '<button id="free-input-submit" type="submit" disabled aria-label="Отправить сообщение" class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-slate-100 text-slate-700 transition-colors hover:bg-[#1B3A6B] hover:text-white disabled:opacity-40 disabled:hover:bg-slate-100 disabled:hover:text-slate-700 cursor-pointer">' +
            ICONS.send('h-4 w-4') +
            '</button>' +
            '</form>' +
            '<div id="dialogue-bottom-anchor"></div>' +
            '</section>' +
            // Right Column
            '<aside aria-label="Панель работы AI-агентов" class="lg:col-span-5 lg:sticky lg:top-20 space-y-4 ' +
            agentsSectionVisibility +
            '">' +
            '<div class="rounded-xl border border-slate-200 bg-white p-5">' +
            '<div class="flex items-center justify-between gap-2 border-b border-slate-100 pb-3.5">' +
            '<div>' +
            '<div class="text-xs font-medium text-slate-500">' +
            (latestInspectedStep
              ? 'Работа агентов · Шаг ' + latestInspectedStep.stepNumber
              : 'Текущий агент на старте') +
            '</div>' +
            '<h2 class="mt-0.5 text-base font-bold text-slate-900">' +
            escapeHtml(
              isAllStepsDone
                ? 'Критик и Улучшатель'
                : (activeAgentMeta && activeAgentMeta.name) || 'Аналитик договора'
            ) +
            '</h2>' +
            '</div>' +
            '<span class="font-mono text-xs font-semibold tabular-nums text-[#1B3A6B]">' +
            state.completedStepCount +
            '/' +
            scenario.steps.length +
            '</span>' +
            '</div>' +
            agentPanelBodyHtml +
            '</div>' +
            '</aside>' +
            '</div>' +
            '</main>'
          );
        }

        function renderMissionOutcome() {
          const scenario = getScenario(state.activeScenarioId);
          const outcome = scenario.outcome;
          const isReject = outcome.verdictType === 'reject';
          const otherScenario =
            SCENARIOS.find(function (s) {
              return s.id !== scenario.id;
            }) || SCENARIOS[0];

          const renderRiskItems = function (list, numCls) {
            return list
              .map(function (risk, idx) {
                return (
                  '<li class="flex gap-2">' +
                  '<span class="font-mono text-xs font-semibold tabular-nums mt-0.5 ' +
                  numCls +
                  '">' +
                  (idx + 1) +
                  ')</span>' +
                  '<span>' +
                  escapeHtml(risk) +
                  '</span>' +
                  '</li>'
                );
              })
              .join('');
          };

          const fixesHtml = outcome.enhancerFixes
            .map(function (fix, idx) {
              return (
                '<li class="flex items-start gap-3 rounded-lg border border-slate-200 bg-[#F8FAFC] p-4 text-sm leading-relaxed text-slate-800">' +
                '<span class="font-mono text-xs font-bold tabular-nums text-[#1B3A6B] mt-0.5">0' +
                (idx + 1) +
                '</span>' +
                '<span>' +
                escapeHtml(fix) +
                '</span>' +
                '</li>'
              );
            })
            .join('');

          return (
            '<main class="mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">' +
            '<div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">' +
            '<div>' +
            '<div class="text-xs font-medium text-slate-500">Итог миссии · ' +
            escapeHtml(scenario.channelTag) +
            '</div>' +
            '<h1 class="mt-1 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">' +
            escapeHtml(scenario.title) +
            '</h1>' +
            '</div>' +
            '<button type="button" data-action="open-full-contract" data-clauses="" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2 text-xs font-semibold text-slate-700 transition-colors hover:bg-slate-50 hover:text-slate-900 whitespace-nowrap shrink-0 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
            ICONS.fileText('h-4 w-4 text-[#1B3A6B]') +
            '<span>Полный текст договора</span>' +
            '</button>' +
            '</div>' +
            '<div class="mt-5">' +
            renderWorkspacePipeline([], [
              'analyst',
              'lawyer',
              'balance',
              'antagonist',
              'critic',
              'enhancer',
            ]) +
            '</div>' +
            // Top Grid: Safety Index + Verdict
            '<div class="mt-6 grid gap-6 lg:grid-cols-12 lg:items-stretch">' +
            '<section class="flex flex-col justify-between rounded-xl border border-slate-200 bg-white p-6 lg:col-span-5 animate-fade-slide-up">' +
            '<div>' +
            '<div class="text-xs font-semibold text-slate-500">Индекс безопасности договора</div>' +
            '<div class="mt-4 flex items-baseline gap-1.5">' +
            '<span id="outcome-score-value" class="font-mono text-5xl font-bold tabular-nums sm:text-6xl ' +
            (isReject ? 'text-red-600' : 'text-amber-600') +
            '">0</span>' +
            '<span class="font-mono text-xl font-medium tabular-nums text-slate-400">/100</span>' +
            '</div>' +
            '<div class="mt-4 h-2.5 w-full overflow-hidden rounded-full bg-slate-100">' +
            '<div id="outcome-score-bar" class="h-full rounded-full ' +
            (isReject ? 'bg-red-600' : 'bg-amber-500') +
            '" style="width: 0%"></div>' +
            '</div>' +
            '</div>' +
            '<div class="mt-6 flex items-center justify-between border-t border-slate-100 pt-4 text-xs text-slate-500">' +
            '<span>Критичных угроз: ' +
            outcome.criticalRisks.length +
            '</span>' +
            '<span>Средних: ' +
            outcome.mediumRisks.length +
            '</span>' +
            '<span>Незначительных: ' +
            outcome.minorRisks.length +
            '</span>' +
            '</div>' +
            '</section>' +
            '<section class="flex flex-col justify-between rounded-xl border p-6 lg:col-span-7 animate-fade-slide-up ' +
            (isReject ? 'border-red-200 bg-red-50/70' : 'border-amber-200 bg-amber-50/70') +
            '" style="animation-delay: 0.15s">' +
            '<div>' +
            '<div class="flex items-center gap-2 text-xs font-semibold text-slate-600">' +
            (isReject
              ? ICONS.xCircle('h-4 w-4 text-red-600')
              : ICONS.alertTriangle('h-4 w-4 text-amber-600')) +
            '<span>Вердикт Улучшателя</span>' +
            '</div>' +
            '<h2 class="mt-2.5 text-2xl font-bold tracking-tight text-slate-900">' +
            escapeHtml(outcome.verdictTitle) +
            '</h2>' +
            '<p class="mt-3 text-base leading-relaxed text-slate-800">' +
            escapeHtml(outcome.verdictExplanation) +
            '</p>' +
            '</div>' +
            '<div class="mt-6 flex flex-wrap items-center gap-3 border-t border-black/5 pt-4">' +
            '<button type="button" data-action="start-scenario" data-scenario="' +
            otherScenario.id +
            '" class="inline-flex items-center gap-2 rounded-lg bg-[#1B3A6B] px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-[#142D54] whitespace-nowrap cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
            '<span>Разобрать: ' +
            escapeHtml(otherScenario.shortLabel) +
            '</span>' +
            ICONS.arrowRight('h-4 w-4') +
            '</button>' +
            '<button type="button" data-action="start-scenario" data-scenario="' +
            scenario.id +
            '" class="inline-flex items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50 whitespace-nowrap cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
            ICONS.rotateCcw('h-4 w-4') +
            '<span>Пройти заново</span>' +
            '</button>' +
            '</div>' +
            '</section>' +
            '</div>' +
            // Critic Risk Breakdown
            '<section class="mt-6 rounded-xl border border-slate-200 bg-white p-6 animate-fade-slide-up" style="animation-delay: 0.3s">' +
            '<div class="flex items-center gap-2">' +
            ICONS.shieldAlert('h-5 w-5 text-[#1B3A6B]') +
            '<h2 class="text-lg font-bold text-slate-900">Карта рисков от агента «Критик»</h2>' +
            '</div>' +
            '<div class="mt-5 grid gap-5 lg:grid-cols-3">' +
            '<div class="rounded-lg border border-red-200 bg-red-50/50 p-4">' +
            '<div class="text-sm font-bold text-red-800">🔴 Критические (нельзя подписывать)</div>' +
            '<ol class="mt-3 space-y-2.5 text-sm leading-relaxed text-slate-800">' +
            renderRiskItems(outcome.criticalRisks, 'text-red-700') +
            '</ol>' +
            '</div>' +
            '<div class="rounded-lg border border-amber-200 bg-amber-50/50 p-4">' +
            '<div class="text-sm font-bold text-amber-800">🟠 Средние (нужно исправить)</div>' +
            '<ol class="mt-3 space-y-2.5 text-sm leading-relaxed text-slate-800">' +
            renderRiskItems(outcome.mediumRisks, 'text-amber-700') +
            '</ol>' +
            '</div>' +
            '<div class="rounded-lg border border-emerald-200 bg-emerald-50/50 p-4">' +
            '<div class="text-sm font-bold text-emerald-800">🟢 Незначительные</div>' +
            '<ol class="mt-3 space-y-2.5 text-sm leading-relaxed text-slate-800">' +
            renderRiskItems(outcome.minorRisks, 'text-emerald-700') +
            '</ol>' +
            '</div>' +
            '</div>' +
            '</section>' +
            // Enhancer Fixes
            '<section class="mt-6 rounded-xl border border-slate-200 bg-white p-6 animate-fade-slide-up" style="animation-delay: 0.45s">' +
            '<div class="flex flex-col gap-1 sm:flex-row sm:items-center sm:justify-between">' +
            '<div class="flex items-center gap-2">' +
            ICONS.checkCircle2('h-5 w-5 text-[#1B3A6B]') +
            '<h2 class="text-lg font-bold text-slate-900">Правки Улучшателя</h2>' +
            '</div>' +
            '<span class="text-xs text-slate-500">Что добавить в договор перед подписанием</span>' +
            '</div>' +
            '<ul class="mt-5 grid gap-3 sm:grid-cols-2">' +
            fixesHtml +
            '</ul>' +
            '<div class="mt-6 flex flex-wrap items-center justify-between gap-4 border-t border-slate-100 pt-5">' +
            '<button type="button" data-action="go-home" class="text-sm font-semibold text-slate-600 transition-colors hover:text-[#1B3A6B] cursor-pointer">Вернуться на главный экран</button>' +
            '<button type="button" data-action="start-scenario" data-scenario="' +
            otherScenario.id +
            '" class="inline-flex items-center gap-2 rounded-lg bg-[#1B3A6B] px-5 py-2.5 text-sm font-semibold text-white transition-colors hover:bg-[#142D54] cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
            '<span>Перейти ко второму сценарию</span>' +
            ICONS.arrowRight('h-4 w-4') +
            '</button>' +
            '</div>' +
            '</section>' +
            '</main>'
          );
        }

        function renderContractModal() {
          if (!state.contractModalOpen) return '';
          const scenario = getScenario(state.activeScenarioId);

          const clausesHtml = scenario.clauses
            .map(function (clause) {
              const isHighlighted = state.highlightedClauses.indexOf(clause.number) !== -1;
              return (
                '<div class="rounded-lg border p-4 transition-colors ' +
                (isHighlighted
                  ? 'border-[#1B3A6B]/40 bg-[#1B3A6B]/[0.04]'
                  : 'border-slate-200 bg-slate-50/50') +
                '">' +
                '<div class="flex items-center justify-between gap-2">' +
                '<h3 class="text-sm font-bold text-slate-900">' +
                '<span class="font-mono text-[#1B3A6B] tabular-nums mr-1.5">' +
                clause.number +
                '.</span>' +
                escapeHtml(clause.title) +
                '</h3>' +
                (isHighlighted
                  ? '<span class="text-xs font-medium text-[#1B3A6B]">Разбирается сейчас</span>'
                  : '') +
                '</div>' +
                '<p class="mt-2 text-sm leading-relaxed text-slate-700">' +
                escapeHtml(clause.text) +
                '</p>' +
                '</div>'
              );
            })
            .join('');

          return (
            '<div id="contract-modal-backdrop" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 p-4 backdrop-blur-sm" role="dialog" aria-modal="true" aria-labelledby="contract-modal-title">' +
            '<div id="contract-modal-card" class="flex max-h-[85vh] w-full max-w-2xl flex-col rounded-xl border border-slate-200 bg-white shadow-xl">' +
            '<div class="flex items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">' +
            '<div class="min-w-0">' +
            '<h2 id="contract-modal-title" class="truncate text-lg font-bold text-slate-900">Полный текст договора</h2>' +
            '<p class="mt-0.5 text-xs text-slate-500">' +
            escapeHtml(scenario.title) +
            ' · ' +
            scenario.clauses.length +
            ' разделов</p>' +
            '</div>' +
            '<button type="button" data-action="close-contract-modal" aria-label="Закрыть окно с текстом договора" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-slate-200 text-slate-500 transition-colors hover:bg-slate-100 hover:text-slate-900 cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">' +
            ICONS.x('h-4 w-4') +
            '</button>' +
            '</div>' +
            '<div class="overflow-y-auto px-6 py-5 space-y-4">' +
            clausesHtml +
            '</div>' +
            '<div class="flex justify-end border-t border-slate-200 px-6 py-3.5">' +
            '<button type="button" data-action="close-contract-modal" class="rounded-lg bg-[#1B3A6B] px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-[#142D54] cursor-pointer focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#1B3A6B]">Вернуться к разбору</button>' +
            '</div>' +
            '</div>' +
            '</div>'
          );
        }

        function animateOutcomeScore() {
          stopOutcomeAnimation();
          const scoreEl = document.getElementById('outcome-score-value');
          const barEl = document.getElementById('outcome-score-bar');
          if (!scoreEl || !barEl) return;

          const target = getScenario(state.activeScenarioId).outcome.safetyIndex;
          const prefersReduced =
            window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          if (prefersReduced) {
            scoreEl.textContent = String(target);
            barEl.style.width = target + '%';
            return;
          }

          const duration = 1100;
          const start = performance.now();

          function tick(now) {
            const elapsed = now - start;
            const progress = Math.min(elapsed / duration, 1);
            const eased = 1 - Math.pow(1 - progress, 3);
            const val = Math.round(eased * target);
            scoreEl.textContent = String(val);
            barEl.style.width = val + '%';
            if (progress < 1) {
              outcomeRafId = window.requestAnimationFrame(tick);
            }
          }

          outcomeRafId = window.requestAnimationFrame(tick);
        }

        // =====================================================================
        // 6. ОБЩИЙ РЕНДЕР И НАВЕШИВАНИЕ СОБЫТИЙ
        // =====================================================================
        function renderApp(options) {
          const opts = options || {};
          const root = document.getElementById('root');
          if (!root) return;

          let bodyHtml = '';
          if (state.viewMode === 'landing') {
            bodyHtml = renderLandingView();
          } else if (state.viewMode === 'workspace') {
            bodyHtml = renderAuditWorkspace();
          } else {
            bodyHtml = renderMissionOutcome();
          }

          root.innerHTML =
            '<div class="min-h-screen bg-[#F8FAFC] text-[#0F172A]">' +
            renderTopBar() +
            bodyHtml +
            renderContractModal() +
            '</div>';

          if (state.viewMode === 'landing') {
            startHeroTimer();
          } else {
            stopHeroTimer();
          }

          if (state.viewMode === 'outcome' && opts.animateScore) {
            animateOutcomeScore();
          }

          if (state.viewMode === 'workspace') {
            wireFreeInputForm();
            if (opts.scrollToBottom) {
              const anchor = document.getElementById('dialogue-bottom-anchor');
              if (anchor) {
                anchor.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              }
            }
          }
        }

        function wireFreeInputForm() {
          const form = document.getElementById('free-input-form');
          const input = document.getElementById('free-input-field');
          const submitBtn = document.getElementById('free-input-submit');
          if (!form || !input || !submitBtn) return;

          input.addEventListener('input', function () {
            submitBtn.disabled = !input.value.trim() || state.isTyping;
          });

          form.addEventListener('submit', function (e) {
            e.preventDefault();
            const trimmed = input.value.trim();
            if (!trimmed || state.isTyping) return;
            if (state.showHintBubble) state.showHintBubble = false;

            state.dialogue.push({
              id: 'free-' + Date.now(),
              kind: 'user-free-input',
              text: trimmed,
            });
            state.isTyping = true;
            renderApp({ scrollToBottom: true });

            const t = window.setTimeout(function () {
              state.dialogue.push({
                id: 'demo-reply-' + Date.now(),
                kind: 'demo-honest-reply',
                text: FREE_INPUT_RESPONSE,
              });
              state.isTyping = false;
              renderApp({ scrollToBottom: true });
            }, 420);
            workspaceTimers.push(t);
          });
        }

        // =====================================================================
        // 7. ОБРАБОТЧИКИ ДЕЙСТВИЙ ПОЛЬЗОВАТЕЛЯ
        // =====================================================================
        function startScenario(scenarioId) {
          clearWorkspaceTimers();
          stopOutcomeAnimation();
          state.activeScenarioId = scenarioId;
          state.viewMode = 'workspace';
          state.currentStepIndex = 0;
          state.completedStepCount = 0;
          state.dialogue = [];
          state.isTyping = false;
          state.showAgentDetails = false;
          state.mobileTab = 'contract';
          state.flashCounter += 1;
          state.lastFlashRendered = state.flashCounter;
          state.contractModalOpen = false;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function goHome() {
          clearWorkspaceTimers();
          stopOutcomeAnimation();
          state.viewMode = 'landing';
          state.contractModalOpen = false;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function scrollToSection(sectionId) {
          if (state.viewMode !== 'landing') {
            clearWorkspaceTimers();
            stopOutcomeAnimation();
            state.viewMode = 'landing';
            state.contractModalOpen = false;
            renderApp();
            window.setTimeout(function () {
              const target = document.getElementById(sectionId);
              if (target) target.scrollIntoView({ behavior: 'smooth' });
            }, 60);
            return;
          }
          const target = document.getElementById(sectionId);
          if (target) target.scrollIntoView({ behavior: 'smooth' });
        }

        function handleSelectReply(replyId) {
          if (state.isTyping) return;
          const scenario = getScenario(state.activeScenarioId);
          if (state.completedStepCount >= scenario.steps.length) return;
          if (state.showHintBubble) state.showHintBubble = false;

          const step = scenario.steps[state.currentStepIndex];
          const stepIdx = state.currentStepIndex;
          const reply = step.replies.find(function (r) {
            return r.id === replyId;
          });
          if (!reply) return;

          state.dialogue.push({
            id: 'reply-' + step.stepNumber + '-' + Date.now(),
            kind: 'user-reply',
            stepNumber: step.stepNumber,
            sectionLabel: step.sectionLabel,
            text: reply.label,
          });
          state.isTyping = true;
          renderApp({ scrollToBottom: true });

          const t1 = window.setTimeout(function () {
            if (reply.systemComment) {
              state.dialogue.push({
                id: 'comment-' + step.stepNumber + '-' + Date.now(),
                kind: 'system-comment',
                stepNumber: step.stepNumber,
                text: reply.systemComment,
              });
              renderApp({ scrollToBottom: true });
            }

            const t2 = window.setTimeout(
              function () {
                state.dialogue.push({
                  id: 'summary-' + step.stepNumber + '-' + Date.now(),
                  kind: 'step-findings-summary',
                  stepNumber: step.stepNumber,
                  sectionLabel: step.sectionLabel,
                  text: step.findings
                    .map(function (f) {
                      return f.agentLabel + ': ' + f.text;
                    })
                    .join(' '),
                });

                state.isTyping = false;
                state.completedStepCount = stepIdx + 1;
                state.flashCounter += 1;

                if (stepIdx + 1 < scenario.steps.length) {
                  state.currentStepIndex = stepIdx + 1;
                }
                renderApp({ scrollToBottom: true });
              },
              reply.systemComment ? 420 : 120
            );

            workspaceTimers.push(t2);
          }, 450);

          workspaceTimers.push(t1);
        }

        // Global delegated click handler
        document.addEventListener('click', function (e) {
          const modalBackdrop = document.getElementById('contract-modal-backdrop');
          if (
            state.contractModalOpen &&
            modalBackdrop &&
            e.target === modalBackdrop
          ) {
            state.contractModalOpen = false;
            renderApp();
            return;
          }

          const btn = e.target.closest('[data-action]');
          if (!btn) return;
          const action = btn.getAttribute('data-action');

          if (action === 'go-home') {
            goHome();
          } else if (action === 'start-scenario') {
            const scId = btn.getAttribute('data-scenario');
            if (scId) startScenario(scId);
          } else if (action === 'scroll-section') {
            const secId = btn.getAttribute('data-section');
            if (secId) scrollToSection(secId);
          } else if (action === 'dismiss-hint') {
            state.showHintBubble = false;
            renderApp();
          } else if (action === 'mobile-tab') {
            const tab = btn.getAttribute('data-tab');
            if (tab === 'contract' || tab === 'agents') {
              state.mobileTab = tab;
              renderApp();
            }
          } else if (action === 'select-reply') {
            const replyId = btn.getAttribute('data-reply-id');
            if (replyId) handleSelectReply(replyId);
          } else if (action === 'toggle-agent-details') {
            if (state.showHintBubble) state.showHintBubble = false;
            state.showAgentDetails = !state.showAgentDetails;
            renderApp();
          } else if (action === 'finish-mission') {
            state.viewMode = 'outcome';
            renderApp({ animateScore: true });
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (action === 'open-full-contract') {
            const raw = btn.getAttribute('data-clauses') || '';
            state.highlightedClauses = raw
              ? raw.split(',').map(function (n) {
                  return parseInt(n, 10);
                })
              : [];
            state.contractModalOpen = true;
            renderApp();
          } else if (action === 'close-contract-modal') {
            state.contractModalOpen = false;
            renderApp();
          }
        });

        // Escape key closes contract modal
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape' && state.contractModalOpen) {
            state.contractModalOpen = false;
            renderApp();
          }
        });

        // Initial boot
        renderApp();
      })();
    </script>
  </body>
</html>
